<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin - Nuevo Producto · TECNOROSITA</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header id="site-header"></header>

    <main class="page-section">
        <div class="container" style="max-width: 600px; margin: 40px auto; background: var(--surface); padding: 40px; border-radius: 12px; border: 1px solid var(--border);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                <div>
                    <span class="section-eyebrow">Bodega</span>
                    <h2 class="section-title">Registrar Dispositivo</h2>
                </div>
                <a href="home-admin.html" class="btn btn--outline">Volver</a>
            </div>
            
            <form id="formProducto">
                <div class="form-group" style="margin-bottom: 15px;">
                    <label>Nombre del Producto:</label>
                    <input type="text" id="codigo" class="form-control" placeholder="Ej: Teclado Mecánico RGB" required>
                    <span class="form-error" id="errorCodigo" style="color: red; font-size: 0.85rem;"></span>
                </div>
                
                <div class="form-group" style="margin-bottom: 15px;">
                    <label>Categoría (Opcional visual):</label>
                    <select id="nombreProd" class="form-control">
                        <option value="smartphone">Smartphones</option>
                        <option value="laptop">Computadores</option>
                        <option value="accesorios">Accesorios</option>
                    </select>
                </div>
                
                <div class="form-group" style="margin-bottom: 15px;">
                    <label>Descripción:</label>
                    <textarea id="descProd" class="form-control" rows="3" maxlength="500"></textarea>
                </div>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 25px;">
                    <div class="form-group">
                        <label>Precio ($):</label>
                        <input type="number" id="precio" class="form-control" step="1" min="0" required>
                        <span class="form-error" id="errorPrecio" style="color: red; font-size: 0.85rem;"></span>
                    </div>
                    <div class="form-group">
                        <label>Stock Bodega:</label>
                        <input type="number" id="stock" class="form-control" min="0" required>
                    </div>
                    <div class="form-group">
                        <label>Stock Crítico:</label>
                        <input type="number" id="stockCritico" class="form-control" min="0" placeholder="Ej: 5">
                    </div>
                </div>

                <button type="submit" class="btn btn--gold btn--block btn--lg">Añadir al Catálogo</button>
            </form>
        </div>
    </main>

    <footer id="site-footer"></footer>

    <script src="js/data.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/main.js"></script>
    <script>initLayout("");</script>
</body>
</html>
