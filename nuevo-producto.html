<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin - Nuevo Producto</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <h2>Admin Console | TecnoRosita</h2>
            <a href="home-admin.html">Volver al Home</a>
        </nav>
    </header>
    <main>
        <section class="formulario-container">
            <h2>Registrar Nuevo Dispositivo</h2>
            <form id="formProducto">
                <div class="form-group">
                    <label>Código de Producto:</label>
                    <input type="text" id="codigo" required>
                    <span class="error-msg" id="errorCodigo"></span>
                </div>
                <div class="form-group">
                    <label>Nombre del Producto:</label>
                    <input type="text" id="nombreProd" maxlength="100" required>
                </div>
                <div class="form-group">
                    <label>Descripción:</label>
                    <textarea id="descProd" maxlength="500"></textarea>
                </div>
                <div class="form-group">
                    <label>Categoría:</label>
                    <select required>
                        <option value="smartphone">Smartphones</option>
                        <option value="laptop">Computadores</option>
                        <option value="accesorios">Accesorios</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Precio ($):</label>
                    <input type="number" id="precio" step="0.01" required>
                    <span class="error-msg" id="errorPrecio"></span>
                </div>
                <div class="form-group">
                    <label>Stock en Bodega (Entero):</label>
                    <input type="number" id="stock" required>
                </div>
                <div class="form-group">
                    <label>Stock Crítico (Alerta Mínima):</label>
                    <input type="number" id="stockCritico">
                </div>
                <button type="submit" class="btn-primary">Añadir al Catálogo</button>
            </form>
        </section>
    </main>
    <script src="js/main.js"></script>
</body>
</html>
