<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Editar Producto · TECNOROSITA</title><link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/mejoras.css"></head><body><header id="site-header"></header><main class="page-section"><div class="container"><h1>Editar producto</h1><a href="home-admin.html" class="btn btn--outline" style="margin-bottom:20px">Volver</a><form id="formEditarProducto" class="admin-box" novalidate><div class="admin-grid"><div class="form-group"><label for="eCodigo">Código <span class="required">*</span></label><input type="text" id="eCodigo" class="form-control" ><span class="form-hint">Mín. 3 caracteres</span><span class="form-error" role="alert"></span></div><div class="form-group"><label for="eCategoria">Categoría <span class="required">*</span></label><select id="eCategoria" class="form-control"></select><span class="form-error" role="alert"></span></div><div class="form-group"><label for="eNombre">Nombre <span class="required">*</span></label><input type="text" id="eNombre" class="form-control" maxlength="100"><span class="form-error" role="alert"></span></div><div class="form-group"><label for="eDescripcion">Descripción <small style="color:var(--text-faint)">(opcional)</small></label><textarea id="eDescripcion" class="form-control" rows="3" maxlength="500"></textarea><span class="form-error" role="alert"></span></div><div class="form-group"><label for="ePrecio">Precio ($) <span class="required">*</span></label><input type="number" id="ePrecio" class="form-control" min="0" step="any"><span class="form-hint">Mín. 0, acepta decimales</span><span class="form-error" role="alert"></span></div><div class="form-group"><label for="eStock">Stock <span class="required">*</span></label><input type="number" id="eStock" class="form-control" min="0" step="1"><span class="form-hint">Enteros</span><span class="form-error" role="alert"></span></div><div class="form-group"><label for="eStockCritico">Stock crítico <small style="color:var(--text-faint)">(opcional)</small></label><input type="number" id="eStockCritico" class="form-control" min="0" step="1"><span class="form-hint">Alerta si stock ≤ crítico</span><span class="form-error" role="alert"></span></div><div class="form-group"><label>Imagen <small style="color:var(--text-faint)">(opcional)</small></label><input type="file" id="eImagen" class="form-control" accept="image/*"><span class="form-error" role="alert"></span><img id="ePreview" class="img-preview" alt="Vista previa"></div></div><p class="alerta-stock" id="eAviso" role="status" hidden></p><button type="submit" class="btn btn--gold btn--block btn--lg">Guardar cambios</button></form></div></main><footer id="site-footer"></footer><script src="js/data.js"></script><script src="js/imagenes.js"></script><script src="js/cart.js"></script><script src="js/layout.js"></script><script src="js/validaciones.js"></script><script src="js/roles.js"></script><script src="js/admin-extra.js"></script><script src="js/experiencia.js"></script>
  <script>initLayout("");</script></body></html>
