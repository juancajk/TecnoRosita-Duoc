<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Editar Usuario · TECNOROSITA</title><link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/mejoras.css"></head><body><header id="site-header"></header><main class="page-section"><div class="container"><h1>Editar usuario</h1><a href="admin-usuarios.html" class="btn btn--outline" style="margin-bottom:20px">Volver</a><form id="formUsuario" class="admin-box" novalidate><div class="admin-grid"><div class="form-group"><label for="uRun">RUN <span class="required">*</span></label><input type="text" id="uRun" class="form-control" maxlength="9" placeholder="123456785"><span class="form-hint">Sin puntos ni guion</span><span class="form-error" role="alert"></span></div><div class="form-group"><label for="uTipo">Tipo <span class="required">*</span></label><select id="uTipo" class="form-control"><option value="">Seleccione perfil</option><option value="admin">Administrador</option><option value="vendedor">Vendedor</option><option value="cliente">Cliente</option></select><span class="form-error" role="alert"></span></div><div class="form-group"><label for="uNombre">Nombre <span class="required">*</span></label><input type="text" id="uNombre" class="form-control" maxlength="50"><span class="form-error" role="alert"></span></div><div class="form-group"><label for="uApellidos">Apellidos <span class="required">*</span></label><input type="text" id="uApellidos" class="form-control" maxlength="100"><span class="form-error" role="alert"></span></div><div class="form-group"><label for="uCorreo">Correo <span class="required">*</span></label><input type="email" id="uCorreo" class="form-control" maxlength="100"><span class="form-hint">@duoc.cl, @profesor.duoc.cl, @gmail.com</span><span class="form-error" role="alert"></span></div><div class="form-group"><label for="uFecha">Fecha nac. <small style="color:var(--text-faint)">(opcional)</small></label><input type="date" id="uFecha" class="form-control" ><span class="form-error" role="alert"></span></div><div class="form-group"><label for="uPass">Contraseña <span class="required">*</span></label><input type="password" id="uPass" class="form-control" maxlength="10"><span class="form-hint">4 a 10 caracteres</span><span class="form-error" role="alert"></span></div><div class="form-group"><label for="uRegion">Región <span class="required">*</span></label><select id="uRegion" class="form-control"></select><span class="form-error" role="alert"></span></div><div class="form-group"><label for="uComuna">Comuna <span class="required">*</span></label><select id="uComuna" class="form-control"></select><span class="form-error" role="alert"></span></div><div class="form-group"><label for="uDireccion">Dirección <span class="required">*</span></label><input type="text" id="uDireccion" class="form-control" maxlength="300"><span class="form-error" role="alert"></span></div></div><button type="submit" class="btn btn--gold btn--block btn--lg">Guardar cambios</button></form></div></main><footer id="site-footer"></footer><script src="js/data.js"></script><script src="js/imagenes.js"></script><script src="js/cart.js"></script><script src="js/layout.js"></script><script src="js/validaciones.js"></script><script src="js/roles.js"></script><script src="js/admin-extra.js"></script><script src="js/experiencia.js"></script>
  <script>initLayout("");</script></body></html>
