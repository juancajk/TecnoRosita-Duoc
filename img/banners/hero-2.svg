    <rect x="56" y="24" width="16" height="13" rx="2.5"/><rect x="75" y="24" width="16" height="13" rx="2.5"/>
    <rect x="94" y="24" width="16" height="13" rx="2.5"/><rect x="113" y="24" width="16" height="13" rx="2.5"/>
    <rect x="132" y="24" width="16" height="13" rx="2.5"/><rect x="151" y="24" width="16" height="13" rx="2.5"/>
    <rect x="170" y="24" width="16" height="13" rx="2.5"/><rect x="189" y="24" width="16" height="13" rx="2.5"/>
    <rect x="208" y="24" width="16" height="13" rx="2.5"/><rect x="227" y="24" width="63" height="29" rx="2.5"/>
  </g>
  <!-- Teclas fila 3 + 4 -->
  <g fill="#1e1a2e" opacity=".65">
    <rect x="10" y="40" width="30" height="13" rx="2.5"/><rect x="43" y="40" width="16" height="13" rx="2.5"/>
    <rect x="62" y="40" width="16" height="13" rx="2.5"/><rect x="81" y="40" width="16" height="13" rx="2.5"/>
    <rect x="100" y="40" width="16" height="13" rx="2.5"/><rect x="119" y="40" width="16" height="13" rx="2.5"/>
    <rect x="138" y="40" width="16" height="13" rx="2.5"/><rect x="157" y="40" width="16" height="13" rx="2.5"/>
    <rect x="176" y="40" width="16" height="13" rx="2.5"/><rect x="195" y="40" width="16" height="13" rx="2.5"/>
    <rect x="10" y="56" width="38" height="13" rx="2.5"/><rect x="51" y="56" width="16" height="13" rx="2.5"/>
    <rect x="70" y="56" width="130" height="13" rx="2.5"/>
    <rect x="203" y="56" width="16" height="13" rx="2.5"/><rect x="222" y="56" width="16" height="13" rx="2.5"/>
    <rect x="241" y="56" width="16" height="13" rx="2.5"/><rect x="260" y="56" width="30" height="13" rx="2.5"/>
  </g>
  <!-- WASD glow -->
  <rect x="37" y="24" width="16" height="13" rx="2.5" fill="#d4a93c" opacity=".2"/>
  <rect x="10" y="40" width="30" height="13" rx="2.5" fill="#d4a93c" opacity=".12"/>
  <rect x="43" y="40" width="16" height="13" rx="2.5" fill="#d4a93c" opacity=".2"/>
