  <rect x="0" y="0" width="300" height="95" rx="8" fill="#100c18" stroke="#251e38" stroke-width="1.5"/>
  <!-- Teclas fila 1 -->
  <g fill="#1e1a2e" opacity=".65">
    <rect x="10" y="8" width="16" height="13" rx="2.5"/><rect x="29" y="8" width="16" height="13" rx="2.5"/>
    <rect x="48" y="8" width="16" height="13" rx="2.5"/><rect x="67" y="8" width="16" height="13" rx="2.5"/>
    <rect x="86" y="8" width="16" height="13" rx="2.5"/><rect x="105" y="8" width="16" height="13" rx="2.5"/>
    <rect x="124" y="8" width="16" height="13" rx="2.5"/><rect x="143" y="8" width="16" height="13" rx="2.5"/>
    <rect x="162" y="8" width="16" height="13" rx="2.5"/><rect x="181" y="8" width="16" height="13" rx="2.5"/>
    <rect x="200" y="8" width="16" height="13" rx="2.5"/><rect x="219" y="8" width="16" height="13" rx="2.5"/>
