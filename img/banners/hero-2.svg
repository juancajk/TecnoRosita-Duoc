  <!-- RGB underglow -->
  <rect x="0" y="72" width="300" height="3" rx="1" fill="#b69ce8" filter="url(#n2)" opacity=".3"/>
</g>

<!-- ====== MOUSE ====== -->
<g transform="translate(1020,490)">
  <ellipse cx="15" cy="22" rx="16" ry="26" fill="#100c18" stroke="#251e38" stroke-width="1"/>
  <ellipse cx="15" cy="8" rx="12" ry="9" fill="#181430"/>
  <line x1="15" y1="1" x2="15" y2="15" stroke="#201a30" stroke-width=".8"/>
  <circle cx="15" cy="10" r="3" fill="#b69ce8" filter="url(#n2)" opacity=".4"/>
</g>

<!-- Reflejo dorado en escritorio -->
<ellipse cx="920" cy="510" rx="280" ry="50" fill="#d4a93c" opacity=".025" filter="url(#bl10)"/>

<!-- Partículas -->
<circle cx="620" cy="80" r="1.8" fill="#d4a93c" opacity=".4"><animate attributeName="opacity" values=".2;.5;.2" dur="3s" repeatCount="indefinite"/></circle>
<circle cx="1200" cy="150" r="1.2" fill="#b69ce8" opacity=".35"><animate attributeName="opacity" values=".15;.45;.15" dur="4s" repeatCount="indefinite"/></circle>
<circle cx="850" cy="420" r="1" fill="#d4a93c" opacity=".3"/>
<circle cx="1320" cy="380" r="1.5" fill="#b69ce8" opacity=".25"/>
</svg>
